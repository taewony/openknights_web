# .github/workflows/deploy-on-push.yml

name: Deploy to Firebase Hosting on Push
'on':
  push:
    branches:
      - main # 'main' 브랜치에 push 될 때만 워크플로우를 실행합니다.
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_deploy: # 작업 이름을 'build_and_preview'에서 변경 (권장)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENKNIGHTS_TZ5I8 }}
          projectId: openknights-tz5i8
          channelId: live # 이 부분을 추가해야 합니다.